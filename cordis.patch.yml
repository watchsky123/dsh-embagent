# Bundle layer contributed by dsh-embagent.
#
# Shape is the Loader's patch syntax, verified against
# `@deepseek-ai/dsh-agent-preset/skills/cordis-plugin-development/references/host-plugin.md`
# and against `dsh-hwforge`'s working patch: a top-level array whose entries are
# `insert` lists of plugin rows. `name` must equal the package name — the loader
# resolves it from the profile's node_modules and reports a mismatch as
# "plugin not found", not as a naming error.
#
# The earlier `kind: plugin / entry: ./dist/index.js` form was **not** Loader
# syntax; a bundle whose patch fails to parse is skipped silently by the loader
# (it lands in `skippedBundles`), which looks exactly like "the plugin did
# nothing".
- insert:
    - id: embagent
      name: dsh-embagent
